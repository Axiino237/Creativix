<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e040a0"/>
      <stop offset="50%" stop-color="#7c3af9"/>
      <stop offset="100%" stop-color="#06c8d4"/>
    </linearGradient>
  </defs>

  <!-- Bold C arc -->
  <path
    d="M52 14C46 8 38 5 30 5C15.6 5 4 16.6 4 31S15.6 57 30 57c8 0 16-3 22-9"
    stroke="url(#grad)"
    stroke-width="8"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Sparkle star top-right -->
  <g transform="translate(48, 12)">
    <line x1="0" y1="-6" x2="0" y2="6" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="-4" y1="-4" x2="4" y2="4" stroke="url(#grad)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="4" y1="-4" x2="-4" y2="4" stroke="url(#grad)" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
